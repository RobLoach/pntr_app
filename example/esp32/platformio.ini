; pntr_app on the ESP32-2432S028R "Cheap Yellow Display".
;
;   pio run -e cyd -t upload -t monitor
;
; The example screen is 160x120 so that pntr's contiguous RGBA8888 buffer fits in the
; ESP32's DRAM. pntr_app_esp32 upscales it 2x onto the 320x240 panel.

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

build_src_filter = +<*>

; Match the strictness the CMake examples build with.
build_src_flags = -Wall -Wextra

build_flags =
    -I ../../include
    -D PNTR_APP_ESP32
    -D PNTR_APP_ESP32_BOARD_CYD
    -D PNTR_ENABLE_DEFAULT_FONT
    -D PNTR_NO_SAVE_IMAGE
    -D PNTR_APP_ESP32_SD
    -D PNTR_APP_SARGS_MAX_ARGS=1
    -D PNTR_APP_SARGS_BUF_SIZE=16

lib_deps =
    https://github.com/RobLoach/pntr/archive/refs/heads/master.zip
